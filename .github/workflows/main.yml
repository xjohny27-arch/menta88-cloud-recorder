name: Menta 88 recorder

on:
  schedule:
    # Athens windows start 07:55, 09:55, 11:55, 13:55, 17:55, 19:55.
    # Trigger ~25 min early. Both UTC+2 (winter) and UTC+3 (summer) are listed;
    # the script exits immediately for the one that doesn't match.
    - cron: "30 4,5,6,7,8,9,10,11,14,15,16,17 * * *"
  workflow_dispatch:
    inputs:
      test_now:
        description: "Run a 2-minute test recording right now"
        type: boolean
        default: true

concurrency:
  group: menta88
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Record and transcribe
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TEST_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.test_now || 'false' }}
        run: python cloud_recorder.py

      - name: Upload recordings (kept 2 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recordings-${{ github.run_id }}
          path: recordings/
          retention-days: 2
          if-no-files-found: ignore

      - name: Commit magic_words.txt
        if: always()
        run: |
          if [ -n "$(git status --porcelain magic_words.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add magic_words.txt
            git commit -m "Update magic words"
            git pull --rebase
            git push
          fi
