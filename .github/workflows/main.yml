name: Menta 88 recorder

on:
  schedule:
    # Athens windows start 07:55, 09:55, 11:55, 13:55, 17:55, 19:55.
    # Trigger ~5 min early. Both UTC+2 (winter) and UTC+3 (summer) are listed.
    - cron: "50 4,5,6,7,8,9,10,11,14,15,16,17 * * *"
  workflow_dispatch:
    inputs:
      test_now:
        description: "Run a 2-minute test recording right now"
        type: boolean
        default: true
      send_test_email:
        description: "Send a test email to check Gmail setup"
        type: boolean
        default: false

concurrency:
  group: menta88
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # No third-party actions: plain git + the Python already on the runner.
      - name: Get the code
        run: |
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt

      - name: Record and transcribe
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TEST_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.test_now || 'false' }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: "1E5clfjNGZwpabdVW9eTFL48yJDKQIWgB"
          SEND_TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email || 'false' }}
        run: .venv/bin/python cloud_recorder.py 

      - name: Commit magic_words.txt
        if: always()
        run: |
          if [ -n "$(git status --porcelain magic_words.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add magic_words.txt
            git commit -m "Update magic words"
            git pull --rebase
            git push
          fi
